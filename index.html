<style>
:root{
  --ground:#E7EFEE; --surface:#F7FBFA; --ink:#0F2A31; --muted:#58727A; --line:#C6D6D6;
  --accent:#D4501C; --accent-ink:#FFFFFF; --deep:#1D5E68; --deep-soft:#D5E6E6; --chip:#DCE7E6;

  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){

    --accent:#FF7A45; --accent-ink:#1B0A02; --deep:#74C3CB; --deep-soft:#15353D; --chip:#17363F;
    --good:#62C58D; --good-soft:#143526; --warn:#E2B35C; --warn-soft:#3A2D12; --bad:#F2766B; --bad-soft:#3E1B18;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1A20; --surface:#10262E; --ink:#DCEBEC; --muted:#8EA8AD; --line:#23424B;
  --accent:#FF7A45; --accent-ink:#1B0A02; --deep:#74C3CB; --deep-soft:#15353D; --chip:#17363F;
  --good:#62C58D; --good-soft:#143526; --warn:#E2B35C; --warn-soft:#3A2D12; --bad:#F2766B; --bad-soft:#3E1B18;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line)}

.unitbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 9px;font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;flex:none}

textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}

.btn{border:0;border-radius:9px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:7px}

.dive{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.dive:first-child{border-top:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}

th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n{font-family:var(--mono);text-align:right}

.banner{margin-top:12px;background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.aibox{white-space:pre-wrap;font-size:15px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:44px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(9,1fr)}
.tabs button{border:0;background:none;padding:6px 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:0;color:var(--muted);cursor:pointer}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20}
.big{font-family:var(--mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.chart svg{width:100%;height:auto;display:block}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (prefers-reduced-motion:no-preference){.chip,.opt,.chk .letter,.seg button{transition:background .15s,color .15s,border-color .15s}}
.sig{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.sig:first-child{border-top:0}
.sig b{font-size:16px}
.sig .how{grid-column:1 / -1;font-size:14.5px}
.sig .note{grid-column:1 / -1;font-size:13px;color:var(--warn)}
.star{border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.star.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash{min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.flash .q{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
a.lnk{color:var(--deep);font-weight:700}
.alarm{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:10px 12px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.alarm span{font-weight:400;font-size:13.5px;color:var(--ink)}
.caution{border:1px solid var(--warn);background:var(--warn-soft);border-radius:9px;padding:10px 12px;font-size:14px}
.okline{border:1px solid var(--good);background:var(--good-soft);border-radius:9px;padding:8px 12px;font-size:14px;color:var(--ink)}
@keyframes alarmBlink{0%,100%{background:var(--bad-soft);color:var(--bad)}50%{background:var(--bad);color:var(--surface)}}
@keyframes alarmBlinkSpan{0%,100%{color:var(--ink)}50%{color:var(--surface)}}

.section.spread{flex-direction:row}
.chk.ref{cursor:default}
.chk.ref .letter{color:var(--deep);border-color:var(--deep)}
.xfer{margin:4px 0 0;padding-left:18px;font-size:14.5px}
.stat .k small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
.term{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:92px 1fr;gap:2px 12px}
.term:first-child{border-top:0}
.term .a{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--deep);grid-row:span 2}
.term .full{font-weight:700;font-size:15.5px}
.term .def{font-size:14px;color:var(--muted)}
.skill{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.skill:first-child{border-top:0}
.skill .how{font-size:14.5px}
.skill .note{font-size:13px;color:var(--warn)}
.hist{font-size:13.5px;display:flex;flex-direction:column;gap:4px;padding-left:2px}
.sitechips{display:flex;gap:6px;flex-wrap:wrap}
.sitechips .chip{padding:4px 10px;font-size:13px}
.tried{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.tried:first-child{border-top:0}
.sos{border:0;background:var(--bad);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;letter-spacing:.06em;cursor:pointer;flex:none}
.hdr-r{display:flex;gap:6px;align-items:center;flex:none}
@media (max-width:420px){.brand small{display:none}}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.legend i.c{border-top:1.5px solid var(--muted)}
.toc{display:flex;flex-direction:column}
.toc button{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;cursor:pointer;color:var(--ink);width:100%}
.toc button:first-child{border-top:0}
.toc .n{font-family:var(--mono);font-size:13px;color:var(--accent)}
.toc b{font-size:15.5px}
.toc span.d{grid-column:2;font-size:13px;color:var(--muted)}
.guide h4{font-family:var(--display);font-size:18px;letter-spacing:.03em;margin:14px 0 4px}
.guide p{margin:6px 0}
.guide ul,.guide ol{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.guide .path{font-family:var(--mono);font-size:13.5px;background:var(--chip);border-radius:5px;padding:1px 5px}
.guide .tip{border-left:3px solid var(--deep);background:var(--deep-soft);border-radius:0 8px 8px 0;padding:9px 12px;font-size:14px;margin:10px 0}
.cvseg .seg{flex-wrap:nowrap}.cvseg .seg button{flex:1 1 auto;padding:8px 4px;font-size:13.5px}
.btnmap{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14.5px}
.btnmap .b{font-family:var(--mono);font-weight:500;color:var(--deep);white-space:nowrap}
.fa{border-top:1px solid var(--line)}
.fa:first-child{border-top:0}

.fa .redflag{border-left:3px solid var(--bad);background:var(--bad-soft);border-radius:0 8px 8px 0;padding:8px 10px;font-size:14px}

<script>

function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function daysAgo(n){ const d=new Date(Date.now()-n*864e5); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

  const d2 = mk({date:daysAgo(8), site:"Example: sandy slope", weights:{belt:5,pockets:0,trim:0,ankle:0}, startP:200, endP:70, maxDepth:16, avgDepth:10, time:50, check:"eye", feel:["headUp"], rating:4, notes:""});
  const d3 = mk({date:daysAgo(6), site:"Example: wreck", weights:{belt:4,pockets:0,trim:1,ankle:0}, startP:200, endP:80, maxDepth:20, avgDepth:12, time:47, check:"eye", feel:["good"], rating:5, notes:"Level at the stop."});

/* ---------- units ---------- */
const imp = ()=> S.units==="imperial";
const r1 = n => Math.round(n*10)/10;
const U = {
  w: kg => kg==null? "" : imp()? r1(kg*2.20462) : r1(kg),
  wIn: v => imp()? v/2.20462 : v,
  wu: () => imp()? "lb":"kg",
  wtxt: kg => imp()? `${Math.max(1,Math.round(kg*2.20462))} lb` : `${kg} kg`,
  d: m => m==null? "" : imp()? Math.round(m*3.28084) : r1(m),
  dIn: v => imp()? v/3.28084 : v,
  du: () => imp()? "ft":"m",
  p: b => b==null? "" : imp()? Math.round(b*14.5038/10)*10 : Math.round(b),
  pIn: v => imp()? v/14.5038 : v,
  pu: () => imp()? "psi":"bar",
  rmv: l => imp()? (l*0.0353147).toFixed(2) : l.toFixed(1),
  ru: () => imp()? "cu ft/min":"L/min"
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n)? n : null; };
function keyOf(d){ return [d.suit,d.tank,d.water,d.bcd].join("|"); }
function keyLabel(k){ const [s,t,w,b]=k.split("|"); return `${SUITS[s]||s} · ${(TANKS[t]||{}).s||t} · ${w==="fresh"?"Fresh":"Salt"} · ${BCDS[b]||b}`; }
function totalW(w){ return w? (w.belt||0)+(w.pockets||0)+(w.trim||0)+(w.ankle||0) : 0; }
function divesFor(k){ return S.dives.filter(d=>d.key===k && !d.quick).sort((a,b)=> a.date<b.date?-1: a.date>b.date?1:0); }
function sorted(){ return S.dives.slice().sort((a,b)=> a.date<b.date?1: a.date>b.date?-1:0); }
function rmvOf(d){
  const t = TANKS[d.tank]; if(!t || !d.startP || d.endP==null || !d.time || d.avgDepth==null) return null;
  const used = d.startP - d.endP; if(used<=0) return null;
  const ata = d.avgDepth/(d.water==="fresh"?10.3:10) + 1;
  return used * t.L / d.time / ata;
}
function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2? s[m] : (s[m-1]+s[m])/2; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }

function hasIssue(d, issue){
  const f = new Set(d.feel||[]);
  if(issue==="rose") return d.check==="rose" || f.has("stopHard");
  if(issue==="sank") return d.check==="sank";
  if(issue==="tooLight") return f.has("tooLight") || d.check==="rose";
  if(issue==="check") return d.check==="none";
  return f.has(issue);
}

/* ---------- starting estimate ---------- */
function estimate(cfg){
  const bw = S.profile.weightKg; if(!bw) return null;
  const [pct, add] = SUIT_PCT[cfg.suit] || [.06,0];
  let kg = bw*pct + add;
  if(TANKS[cfg.tank] && TANKS[cfg.tank].steel) kg -= 2;
  if(cfg.bcd==="bpw") kg -= 2;
  if(cfg.water==="fresh") kg -= 2;
  return Math.max(0, Math.round(kg*2)/2);
}

/* ---------- rule-based coach ---------- */
function recommend(d, prev, history){
  const f = new Set(d.feel||[]); const W = d.weights||{};
  const out = {issue:null, change:null, gear:"", why:"", skills:[], evalText:"", evalTone:"info", ts:Date.now()};

  let applied = false;
  // 1. evaluate the previous change, if one was recommended in this setup
  if(prev && prev.rec && prev.rec.change){
    const c = prev.rec.change, pw = prev.weights||{};
    applied = false;
    if(c.type==="add") applied = totalW(W) - totalW(pw) >= c.kg*0.6;
    if(c.type==="remove") applied = totalW(pw) - totalW(W) >= c.kg*0.6;
    if(c.type==="move") applied = c.to==="trim" ? (W.trim||0) > (pw.trim||0) : (W.trim||0) < (pw.trim||0);
    if(c.type==="tank") applied = d.tankPos !== prev.tankPos;
    const fixed = !hasIssue(d, prev.rec.issue);
    if(!applied){ out.evalText = `Last recommendation (${c.label}) wasn't applied on this dive.`; out.evalTone="warn"; }
    else if(fixed){ out.evalText = `Last change (${c.label}) worked: the issue didn't repeat. Keep it.`; out.evalTone="good"; }
    else { out.evalText = `Last change (${c.label}) was applied but the issue repeated.`; out.evalTone="warn"; }
  }

  const wasRemoved = !!(prev && prev.rec && prev.rec.change && prev.rec.change.type==="remove" && applied);

  // 2. safety first: under-weighted at reserve
  if(d.check==="rose" || f.has("stopHard")){
    out.issue = "rose";
    out.change = {type:"add", kg:1, label:`add ${U.wtxt(1)}`};
    out.gear = wasRemoved ? `Put back the ${U.wtxt(1)} you removed.` : `Add ${U.wtxt(1)}.`;
    out.why = d.check==="rose"
      ? "You rose at the 5 m check with little gas and an empty BCD. That is under-weighted, and it matters most on the dive where you surface low on gas."
      : "The safety stop was a fight. An aluminum tank is at its most buoyant near reserve, so this is where weighting has to hold.";
  }
  // 3. objective check says too heavy
  else if(d.check==="sank"){
    out.issue = "sank";
    out.change = {type:"remove", kg:1, label:`remove ${U.wtxt(1)}`};
    out.gear = `Remove ${U.wtxt(1)}.`;
    out.why = "You sank at the 5 m check with reserve gas and an empty BCD. Extra lead means extra air in the BCD, more drag, and more inflator work all dive.";
  }
  // 4. subjective only, no check
  else if(d.check==="none" && f.has("tooLight")){
    out.issue = "tooLight";
    out.change = {type:"add", kg:1, label:`add ${U.wtxt(1)}`};
    out.gear = `Add ${U.wtxt(1)}, then confirm with the weight check.`;
    out.why = "Feeling light without a check is treated conservatively: add first, then prove the number at 5 m.";
  }
  else if(d.check==="none" && (f.has("tooHeavy") || f.has("bcdAir") || f.has("floaty"))){
    out.issue = "check";
    out.gear = "No weight change yet. Do the 5 m weight check at the end of the next dive.";
    out.why = "Feeling heavy, floaty, or busy on the inflator is often breathing and BCD technique rather than lead. The check separates the two.";
  }

  // 5. trim, only when weight isn't being changed
  if(!out.change && out.issue!=="check"){
    if(f.has("headUp")){
      out.issue = "headUp";
      if((W.belt||0) + (W.pockets||0) >= 1){ out.change = {type:"move", kg:1, to:"trim", label:`move ${U.wtxt(1)} to trim pockets`}; out.gear = `Move ${U.wtxt(1)} from the belt or pockets to the trim pockets.`; }
      else { out.change = {type:"tank", dir:"up", label:"raise the tank"}; out.gear = "Raise the tank about 5 cm in the cam band."; }
      out.why = "Feet sinking means your mass sits below your center of buoyancy. Shifting weight toward the shoulders levels you without changing the total.";
    } else if(f.has("headDown")){
      out.issue = "headDown";
      if((W.trim||0) >= 1){ out.change = {type:"move", kg:1, to:"belt", label:`move ${U.wtxt(1)} out of trim pockets`}; out.gear = `Move ${U.wtxt(1)} from the trim pockets down to the belt or pockets.`; }
      else { out.change = {type:"tank", dir:"down", label:"lower the tank"}; out.gear = "Lower the tank about 5 cm in the cam band."; }
      out.why = "Head-down attitude means mass is too far forward. Moving it toward the hips levels you without changing the total.";
    } else if(f.has("rollL") || f.has("rollR")){
      const side = f.has("rollL") ? ["left","right"] : ["right","left"];
      out.issue = f.has("rollL") ? "rollL" : "rollR";
      out.gear = `Shift ${imp()? "1 lb":"0.5 kg"} from the ${side[0]} side to the ${side[1]}.`;
      out.why = "A roll almost always comes from uneven pockets, a camera or light clipped on one side, or a tank sitting off-center.";
    }
  }

  // 6. nothing to change
  if(!out.gear){
    const run = (history||[]).filter(x=>x.key===d.key).concat([d]).slice(-3);
    let streak = 0; for(let i=run.length-1;i>=0;i--){ if(run[i].check==="eye") streak++; else break; }
    out.gear = "Keep the same weight and setup.";
    out.why = d.check==="eye"
      ? (streak>=2 ? `Weight confirmed at the 5 m check ${streak} dives in a row. This setup is dialed.` : "The 5 m check came out at eye level. One more confirming dive and this setup is locked in.")
      : "No issues logged. Do the 5 m check next time to confirm the number.";
  }
  if(out.change && (f.has("headUp")||f.has("headDown")) && (out.issue==="rose"||out.issue==="sank"||out.issue==="tooLight")){
    out.why += " Trim comes next, once the total weight is settled. One change per dive.";
  }

  // 7. skill cues
  const skills = [];
  (d.feel||[]).forEach(k=>{ if(SKILL[k] && !skills.includes(SKILL[k])) skills.push(SKILL[k]); });
  const r = rmvOf(d);
  const past = (history||[]).map(rmvOf).filter(x=>x!=null);
  const base = median(past);
  if(r!=null && base!=null && past.length>=2 && r > base*1.25 && !skills.includes(SKILL.fastAir)){
    const c = d.cond||{}, causes = [];
    if(c.current==="strong"||c.current==="mod") causes.push(`${CUR_T[c.current].toLowerCase()} current`);
    if(c.temp!=null && c.temp<24) causes.push("cold water");
    if(f.has("cold")) causes.push("feeling cold");
    if(c.camera==="yes") causes.push("a camera rig");
    const pct = Math.round((r/base-1)*100);
    skills.push(causes.length? `Air use was ${pct}% above your usual, with ${causes.join(" and ")}. Likely conditions, not technique. Compare on a calm dive.` : `Air use was ${pct}% above your usual in easy conditions. ${SKILL.fastAir}`);
  }
  if((f.has("rollL")||f.has("rollR")) && d.cond && d.cond.camera==="yes") skills.push("A camera or light clipped to one side is the usual cause of a roll. Center it or balance with trim weight.");
  out.skills = skills.slice(0,3);
  return out;
}

function latestRec(k){ const h = divesFor(k); return h.length? {dive:h[h.length-1], rec:h[h.length-1].rec} : null; }

function context(k){
  const p = S.profile, lines = [];
  lines.push(`Diver: experienced recreational diver.${p.heightCm?` Height ${p.heightCm} cm.`:""}${p.weightKg?` Weight ${r1(p.weightKg)} kg.`:""} Preferred units: ${S.units}.`);
  if(k){
    lines.push(`Setup: ${keyLabel(k)}.`);
    const h = divesFor(k).slice(-10);
    h.forEach(d=>{
      const r = rmvOf(d);
      lines.push(`- ${d.date} ${d.site||""}: lead belt ${d.weights.belt} / pockets ${d.weights.pockets} / trim ${d.weights.trim} / ankle ${d.weights.ankle} kg (total ${r1(totalW(d.weights))}); tank position ${d.tankPos}; max ${d.maxDepth??"?"} m, avg ${d.avgDepth??"?"} m, ${d.time??"?"} min; 5 m check: ${d.check}; conditions: current ${d.cond&&d.cond.current||"?"}, vis ${d.cond&&d.cond.vis||"?"}, temp ${d.cond&&d.cond.temp!=null?d.cond.temp+" C":"?"}, ${d.cond&&d.cond.entry||"?"} entry, camera ${d.cond&&d.cond.camera||"?"}; felt: ${(d.feel||[]).map(x=>FEEL_T[x]).join(", ")||"nothing noted"}${r!=null?`; RMV ${r.toFixed(1)} L/min`:""}${d.notes?`; notes: ${d.notes}`:""}.`);
    });
    if((S.learnings||[]).length) lines.push("Diver's own learnings: " + S.learnings.map(l=>`${l.date} ${l.title}: ${l.text}`).join(" | "));
    const lr = latestRec(k);
    if(lr) lines.push(`Rule-based recommendation for next dive: ${lr.rec.gear} Reason: ${lr.rec.why}`);
  }
  const sl = S.skills.log.slice(-10);
  if(sl.length) lines.push("Recent skill practice: " + sl.map(l=>{ const x = skillBy(l.skill); return `${l.date} ${x?x[2]:l.skill}: ${SKILL_RES[l.r][1]}${l.note?` (${l.note})`:""}`; }).join("; ") + ".");
  lines.push("The 5 m check: at the end of the dive, 5 m, about 50 bar left, BCD empty, normal breath. 'sank' = overweighted, 'eye' = correct, 'rose' = underweighted, 'none' = not done.");
  return lines.join("\n");
}
function aiErr(e){
  const c = e && e.code;
  if(c==="not_granted") return "AI access was declined for this session. The rule-based coach still works.";
  if(c==="rate_limited") return "Too many requests. Try again in a minute.";
  if(c==="cancelled") return "";
  return "Couldn't reach Claude (no signal?). The rule-based coach above still applies.";
}
let aiCtl = null;
async function runAI(kind){
  const out = $("#aiOut"); if(!out || !ai.sample) return;
  const k = coachKey;
  let prompt;
  if(kind==="coach"){
    prompt = `You are a buoyancy and trim coach reviewing a diver's log.\n\n${context(k)}\n\nGive coaching for the next dive in this setup. Format exactly three short lines:\nGear change: (at most one change, or "none")\nSkill focus: (one or two concrete cues)\nPattern: (what the history shows)\nRules: never recommend removing weight if the most recent dive rose at the 5 m check or had a hard safety stop. If you disagree with the rule-based recommendation, say why. Under 110 words. Plain text, no markdown, no em dashes.`;
  } else {
    const q = ($("#aiQ").value||"").trim(); if(!q){ $("#aiQ").focus(); return; }
    prompt = `You are an experienced dive instructor answering a diver's question.\n\nContext:\n${context(k)}\n\nQuestion: ${q}\n\nAnswer directly and practically, under 150 words, plain text, no markdown, no em dashes. If the question describes possible decompression illness, lung overexpansion injury, or another emergency, lead with: stop diving, breathe 100% oxygen if available, and contact DAN or emergency services.`;
  }
  aiCtl && aiCtl.abort(); aiCtl = new AbortController();
  out.textContent = "Thinking…"; $("#aiStop").hidden = false;
  try{
    await ai.sample(prompt, {signal: aiCtl.signal, cache: kind==="coach", onText: ({text})=>{ out.textContent = text; }});
  }catch(e){
    const msg = aiErr(e); out.textContent = (e && e.text ? e.text + "\n\n" : "") + msg;
  }finally{ const b=$("#aiStop"); if(b) b.hidden = true; }
}

/* --- Dive tab --- */
function newDraft(){
  const last = sorted()[0];
  const d = {id:uid(), stage:"plan", date:today(), site:"", suit:"shorty3", tank:"al80", water:"salt", bcd:"jacket", fins:"", tankPos:"std", gas:"air", fo2:21, fo2Label:null, planDepth:null, planTime:null, weights:{belt:0,pockets:0,trim:0,ankle:0}, startP:200, endP:null, maxDepth:null, avgDepth:null, time:null, check:null, feel:[], rating:null, notes:"", cues:{}, skillRes:{}, sigRot:null, cond:defaultCond(last), surfTime:null, deco:false};
  const realLast = sorted().find(x=>!x.example); if(realLast) d.site = realLast.site || "";
  if(last){ ["suit","tank","water","bcd","fins","tankPos","startP"].forEach(k=> d[k]=last[k]);
    d.weights = Object.assign({}, last.weights); applyRecToDraft(d); }
  else { const e = estimate(d); if(e!=null) d.weights.belt = e; }
  return d;
}
function recentSites(){ const out=[]; sorted().forEach(x=>{ if(!x.example && x.site && !out.includes(x.site)) out.push(x.site); }); return out.slice(0,6); }
function sigRotation(d){
  const pool = SIGNALS.map(x=>x[0]).filter(id=>!S.sigFav.includes(id));
  if(!d.sigRot || d.sigRot.some(id=>S.sigFav.includes(id))){
    const p = pool.slice(); for(let i=p.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
    d.sigRot = p.slice(0,3); save();
  }
  return d.sigRot;
}
function applyRecToDraft(d){
  d.xfer = null; d.applied = false;
  const h = divesFor(keyOf(d));
  if(h.length){ const l = h[h.length-1]; d.weights = Object.assign({}, l.weights); d.tankPos = l.tankPos; d.fins = l.fins; return; }
  const all = sorted(); if(!all.length) return;
  const base = all.find(x=>x.check==="eye") || all[0];
  const t = transferFrom(base, d);
  d.weights = shiftLead(Object.assign({}, base.weights), t.delta);
  d.tankPos = base.tankPos; d.fins = base.fins;
  d.xfer = {date:base.date, site:base.site, confirmed:base.check==="eye", key:base.key, lines:t.lines, delta:t.delta};
}
const half = x => Math.round(x*2)/2;
function transferFrom(base, d){
  const lines = [], bw = S.profile.weightKg || 80; let delta = 0;
  const say = (kg, why)=>{ if(!kg) return; delta += kg; lines.push(`${why}: ${kg>0?"add":"remove"} ${U.w(Math.abs(kg))} ${U.wu()}`); };
  if(base.water!==d.water){
    const off = Math.max(1.5, half(0.025*(bw+25)));
    say(d.water==="fresh"? -off : off, d.water==="fresh"? "Salt to fresh water" : "Fresh to salt water");
  }
  if(base.suit!==d.suit){
    const est = k => bw*(SUIT_PCT[k]||[.06,0])[0] + (SUIT_PCT[k]||[.06,0])[1];
    say(half(est(d.suit)-est(base.suit)), `${SUITS[base.suit]} to ${SUITS[d.suit]}`);
  }
  const bs = (TANKS[base.tank]||{}).steel, ns = (TANKS[d.tank]||{}).steel;
  if(bs!==ns) say(ns? -2 : 2, ns? "Aluminum to steel tank" : "Steel to aluminum tank");
  const bp = base.bcd==="bpw", np = d.bcd==="bpw";
  if(bp!==np) say(np? -2 : 2, np? "To backplate and wing" : "From backplate to BCD");
  const pc = base.rec && base.rec.change;
  if(base.check!=="eye" && pc && (pc.type==="add"||pc.type==="remove")) say(pc.type==="add"? pc.kg : -pc.kg, "Coach's pending change from that dive");
  return {delta, lines};
}
function shiftLead(w, delta){
  if(!delta) return w;
  const main = (w.pockets||0) > (w.belt||0) ? "pockets" : "belt";
  if(delta>0){ w[main] = (w[main]||0) + delta; return w; }
  let left = -delta;
  for(const k of [main, main==="belt"?"pockets":"belt", "ankle", "trim"]){ const take = Math.min(w[k]||0, left); w[k] = r1((w[k]||0) - take); left = r1(left - take); if(left<=0) break; }

function applyChange(d, c){

  else if(c.type==="remove") shiftLead(w, -c.kg);
  else if(c.type==="move" && c.to==="trim"){ const k = (w.pockets||0) > (w.belt||0) ? "pockets" : "belt"; const m = Math.min(c.kg, w[k]||0); w[k] = r1(w[k]-m); w.trim = r1((w.trim||0)+m); }
  else if(c.type==="move"){ const m = Math.min(c.kg, w.trim||0); w.trim = r1(w.trim-m); w.belt = r1((w.belt||0)+m); }
  else if(c.type==="tank"){ d.tankPos = c.dir==="up" ? (d.tankPos==="low"?"std":"high") : (d.tankPos==="high"?"std":"low"); }

}

function noFly(){
  const real = S.dives.filter(x=>x.surfacedAt).sort((a,b)=>b.surfacedAt-a.surfacedAt);
  if(!real.length) return null;
  const last = real[0];
  const repet = real.some(x=> x!==last && last.surfacedAt - x.surfacedAt < 48*3600e3);
  const deco = real.some(x=> x.deco && last.surfacedAt - x.surfacedAt < 48*3600e3);
  const hrs = deco? 24 : repet? 18 : 12;
  const until = last.surfacedAt + hrs*3600e3, left = until - Date.now();
  return {last, hrs, until, left, repet, deco};
}

function noFlyCard(){
  const n = noFly(); if(!n) return "";

  if(n.left <= 0) return "";
  const when = new Date(n.until).toLocaleString([], {weekday:"short", hour:"2-digit", minute:"2-digit"});
  const why = n.deco? "Decompression dive logged. DAN says substantially longer than 18 h. 24 h shown as a floor, not a limit." : n.repet? "Repetitive or multi-day diving: DAN minimum 18 h." : "Single no-deco dive: DAN minimum 12 h.";
  return `<div class="coachcard nofly" style="border-left-color:var(--bad)"><span class="eyebrow" style="color:var(--bad)">No flying or altitude</span>
    <span class="big mono">${fmtLeft(n.left)}</span><span>Earliest: <b>${esc(when)}</b></span>
    <span class="small">${why}</span>
    <span class="small muted">Includes driving over mountain passes. The guidelines were tested at an 8,000 ft cabin: flying yourself higher, or unpressurized, calls for more margin. These are minimums, not guarantees.</span></div>`;
}

    <details class="fa" id="fa-marine"><summary><b>Marine stings and punctures</b><span class="d">Jellyfish, venomous spines, urchins, bites, coral</span></summary><div class="body">

      <ol class="steps">

        <li><b>Vinegar on the area for at least 30 seconds.</b> This is the rule for box jellyfish, which live in Thai and Philippine waters.</li>

        <li><b>Hot water</b> for pain: as hot as they can stand without scalding, about 45 °C (113 °F), for 20 minutes or more. Use a cold pack if there's no hot water.</li>
      </ol>

        <li><b>Remove loose spines</b> you can see. Don't dig for deep ones.</li>
        <li><b>Stingray:</b> control the bleeding. Never pull out a barb stuck in the chest, belly or neck.</li>
        <li><b>Stonefish:</b> always see a doctor. Antivenom exists.</li>

      <h4>Blue-ringed octopus, cone snail, sea snake</h4>

        <li><b>Pressure immobilization:</b> firm, wide bandage over the bite, then wrap the whole limb, then splint it. Keep them still.</li>
        <li><b>Be ready to breathe for them.</b> The venom can paralyze breathing while they stay aware. Rescue breaths may be needed for hours.</li>
      </ol>
      <h4>Coral cuts and scrapes</h4>

      <h4>Allergic reaction</h4>

    </div></details>
    <details class="fa" id="fa-cold"><summary><b>Hypothermia</b><span class="d">Cold after long or repeated dives</span></summary><div class="body">

function gasCheck(tested, label, depthM, water){
  const unit = water==="fresh"? 10.3 : 10, valid = x => x!=null && x>=21 && x<=100;
  let h = "";
  if(!valid(tested) && valid(label) && label>21) h += `<div class="caution"><b>Gas not tested.</b> Analyze the cylinder and enter the tested O₂ %. Checks below use the ${label}% label for now.</div>`;
  const fo2 = valid(tested)? tested : valid(label)? label : null;
  if(!fo2) return h;
  const f = fo2/100, mod14 = (1.4/f-1)*unit, mod16 = (1.6/f-1)*unit;
  const gasName = fo2===21? "Air" : `EAN${fo2}`;
  if(valid(tested) && valid(label) && Math.abs(label-fo2) > 1) h += `<div class="caution"><b>Tested ${fo2}% doesn't match the ${label}% label.</b> Use the tested value, set it on your computer, and correct the label.</div>`;
  const modTxt = `MOD ${U.d(Math.floor(mod14*10)/10)} ${U.du()} at 1.4 · ${U.d(Math.floor(mod16*10)/10)} ${U.du()} at 1.6`;
  if(depthM==null) h += `<div class="okline">${gasName}: ${modTxt}. Enter a planned max depth to check it.</div>`;
  else if(depthM > mod16) h += `<div class="alarm" role="alert">EXCEEDS MOD: DON'T DIVE THIS PLAN<span>Planned ${U.d(depthM)} ${U.du()} is deeper than the 1.6 contingency limit for ${gasName} (${U.d(Math.floor(mod16*10)/10)} ${U.du()}). Change the plan or the gas.</span></div>`;
  else if(depthM > mod14) h += `<div class="alarm" role="alert">PLANNED DEPTH EXCEEDS MOD<span>Planned ${U.d(depthM)} ${U.du()} is past the 1.4 working MOD for ${gasName} (${U.d(Math.floor(mod14*10)/10)} ${U.du()}). Only the contingency margin is left.</span></div>`;
  else h += `<div class="okline">Within MOD. ${modTxt}.</div>`;
  return h;
}
function planGas(d){
  if(d.gas!=="nitrox") return "";
  const mix = d.fo2 || d.fo2Label;
  return `<div class="spread"><span>${mix?`<b class="mono">EAN${mix}</b> ${d.fo2?"tested":"from label"}`:`<span class="muted">No mix entered yet</span>`}</span><button type="button" class="btn slim ghost" data-tab="nitrox">Edit in Nitrox</button></div>` + gasCheck(d.fo2, d.fo2Label, d.planDepth, d.water);
}
function updatePlanGas(){
  const d = S.draft, el = $("#planGas"); if(!el || !d) return;
  el.innerHTML = planGas(d);
}
function updatePlanCoach(){
  const d = S.draft, el = $("#planCoach"); if(!el) return;
  updatePlanGas();
  const k = keyOf(d), h = divesFor(k);
  if(h.length){
    const lr = latestRec(k), c = lr && lr.rec.change;
    const btn = c ? (d.applied ? `<p class="small"><span class="pill good">Applied</span> Weights below include this change.</p>` : `<button type="button" class="btn slim" data-act="applyRec">Apply this change to my gear</button>`) : "";
    el.innerHTML = `<h3>For this setup</h3>` + recCard(k, true) + btn;
  }
  else if(d.xfer){
    const x = d.xfer;
    el.innerHTML = `<h3>For this setup</h3><div class="coachcard"><span class="eyebrow">New setup · carried over</span>
      <div class="gear">Start at ${U.w(totalW(d.weights))} ${U.wu()} total</div>
      <p class="small">From your ${esc(x.date)}${x.site?` ${esc(x.site)}`:""} dive (${x.confirmed?"weight confirmed at the 5 m check":"not yet confirmed at the 5 m check"}).</p>
      ${x.lines.length? `<ul class="xfer">${x.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>` : `<p class="small">No adjustment needed for this change.</p>`}
      <p class="small muted">Already applied to the weights below. Rules of thumb only: the 5 m check on this dive sets the real number.</p></div>`;
  }
  else {
    const e = estimate(d);
    el.innerHTML = `<h3>For this setup</h3><div class="coachcard"><span class="eyebrow">New setup · starting point</span>
      ${e!=null? `<div class="gear">About ${U.w(e)} ${U.wu()} total</div><p class="small muted">A rough rule of thumb from your body weight, suit, tank, BCD and water. The 5 m check at the end of this dive replaces it with a real number.</p>`
      : `<p>No history for this setup yet. Add your body weight under Me for a starting estimate, and do the 5 m check at the end of the dive.</p>`}</div>`;
  }
  const t = $("#wTotal"); if(t) t.textContent = `Total ${U.w(totalW(d.weights))} ${U.wu()}`;
}

function recCard(k, compact){
  const lr = latestRec(k); if(!lr) return "";
  const r = lr.rec;
  const tone = r.issue==="rose"||r.issue==="tooLight" ? "bad" : r.change ? "warn" : r.issue==="check" ? "info" : "good";
  const tag = r.issue==="rose"||r.issue==="tooLight" ? "Safety: add weight" : r.change ? "One change" : r.issue==="check" ? "Measure first" : "Hold";
  return `<div class="coachcard">
    <div class="spread"><span class="eyebrow">Next dive · rule-based</span><span class="pill ${tone}">${tag}</span></div>
    <div class="gear">${esc(r.gear)}</div>
    <p class="small">${esc(r.why)}</p>
    ${r.evalText? `<p class="small"><span class="pill ${r.evalTone}">Last change</span> ${esc(r.evalText)}</p>`:""}
    ${!compact && r.skills.length? `<hr><div class="small"><b>Skill focus</b><ul style="margin:4px 0 0;padding-left:18px">${r.skills.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
    <p class="small muted">Based on ${esc(lr.dive.date)}${lr.dive.site?`, ${esc(lr.dive.site)}`:""} · ${esc(keyLabel(k))}</p>
  </div>`;
}

function sigRow(x, tag){ return `<div class="sig"><b>${esc(x[2])}</b>${tag?`<span class="pill info">${tag}</span>`:`<span class="pill good">Starred</span>`}<span class="how">${esc(x[3])}</span>${x[4]?`<span class="note">${esc(x[4])}</span>`:""}</div>`; }
function preView(d){
  const k = keyOf(d), lr = latestRec(k);

  if(lr && lr.rec.change) adaptive.push({t:`Today's change: ${lr.rec.gear}`, src:"Coach"});
  const recent = sorted().slice(0,3);
  recent.forEach(x=> (x.rec? x.rec.skills:[]).forEach(s=>{ if(!adaptive.some(a=>a.t===s)) adaptive.push({t:s, src:"From recent dives"}); }));
  adaptive.push({t:"Plan the 5 m weight check for the end of the dive", src:"Coach"});
  const cues = adaptive.slice(0,5).concat(S.cues.map(t=>({t, src:""}))).concat((S.learnings||[]).filter(l=>l.cue).map(l=>({t:l.cue, src:"Learned"})));
  const cueHtml = cues.map((c,i)=>`<label class="cue"><input type="checkbox" data-cue="${i}" ${d.cues[i]?"checked":""}><span>${c.src?`<span class="src">${esc(c.src)}</span><br>`:""}${esc(c.t)}</span></label>`).join("");

  const bw = BWRAF.map(refRow).join(""), so = SORTED.map(refRow).join("");

  return `

  <div class="section"><h3>Reminders</h3><div class="panel">${cueHtml}</div></div>
  ${S.skills.queue.length? `<div class="section"><div class="spread"><h3>Skills to try</h3><button type="button" class="btn slim ghost" data-tab="skills">Skills</button></div>
    <div class="panel">${S.skills.queue.map(skillBy).filter(Boolean).map(x=>`<div class="sig"><b>${esc(x[2])}</b><span></span><span class="how">${esc(x[3])}</span>${x[4]?`<span class="note">${esc(x[4])}</span>`:""}</div>`).join("")}</div></div>` : ""}
  <div class="section"><div class="spread"><h3>Signals to agree with your buddy</h3><button type="button" class="btn slim ghost" data-tab="signals">All signals</button></div>
    <div class="panel">${S.sigFav.map(id=>SIG_BY[id]).filter(Boolean).map(x=>sigRow(x,"")).join("")}${sigRotation(d).map(id=>SIG_BY[id]).filter(Boolean).map(x=>sigRow(x,"Rotating review")).join("")}</div>
  </div>

    <div class="panel chkgroup">${bw}</div></div>
  <div class="section"><h3>Descent · SORTED</h3>
    <p class="small muted">On the surface, just before you leave. In order. Don't drop until S-O-R-T-E are done.</p>
    <div class="panel chkgroup">${so}</div></div>
  <div class="section"><button class="btn" type="button" data-act="stage" data-v="debrief">${d.quick?"Surfaced":"Surfaced: debrief"}</button></div>`;
}

  const keys = [...new Set(sorted().filter(d=>!d.quick).map(d=>d.key))];
  if(!keys.length) return `<div class="section"><h1>Coach</h1><p class="muted">Log a dive and the coaching for that setup appears here.</p></div>${learnView()}`;
  if(!coachKey || !keys.includes(coachKey)) coachKey = keys[0];
  const h = divesFor(coachKey);
  const rows = h.slice(-8).reverse().map(d=>{
    const r = rmvOf(d);
    const ck = {sank:["bad","Sank"],eye:["good","Eye"],rose:["bad","Rose"],none:["info","–"]}[d.check]||["info","–"];
    return `<tr><td>${esc(d.date.slice(5))}</td><td class="n">${U.w(totalW(d.weights))}</td><td class="n">${U.w(d.weights.trim)}</td><td><span class="pill ${ck[0]}">${ck[1]}</span></td><td class="n">${r!=null?U.rmv(r):"–"}</td></tr>`; }).join("");
  const aiPart = ai.sample
    ? `<div class="row"><button class="btn slim" type="button" data-act="aiCoach">Get Claude's read on this setup</button><button class="btn slim ghost" type="button" id="aiStop" data-act="aiStop" hidden>Stop</button></div>
       <div class="aibox" id="aiOut" aria-live="polite">Claude reviews the full history for this setup and checks the rule-based call.</div>
       <label class="f">Ask a dive question<textarea id="aiQ" placeholder="e.g. Why do I burn more air on the second dive of the day?"></textarea></label>
       <button class="btn slim ghost" type="button" data-act="aiAsk">Ask</button>`
    : `<p class="small muted">AI coaching turns on when this page is open in Claude with a connection. Until then the rule-based coach above does the work.</p>`;

  <div class="section"><h3>This setup, recent dives</h3>
    <div class="panel tbl"><table><thead><tr><th>Date</th><th class="n">Lead ${U.wu()}</th><th class="n">Trim</th><th>5 m</th><th class="n">${U.ru()}</th></tr></thead><tbody>${rows}</tbody></table></div>

  const totalTime = all.reduce((a,d)=>a+(d.time||0),0);
  const lastR = pts.length? pts[pts.length-1].r : null;
  const list = all.map(d=>{
    const ck = d.quick? ["info","Quick log"] : ({sank:["bad","Sank at 5 m"],eye:["good","Eye level"],rose:["bad","Rose at 5 m"],none:["info","No check"]}[d.check]||["info","No check"]);

      ${d.skillsTried&&d.skillsTried.length?`<div class="chips">${d.skillsTried.map(t=>{ const x = skillBy(t.skill); return x? `<span class="pill ${SKILL_RES[t.r][0]}">${esc(x[2])}: ${SKILL_RES[t.r][1]}</span>` : ""; }).join("")}</div>`:""}
      ${d.feel&&d.feel.length?`<div class="chips">${d.feel.map(k=>`<span class="chip static">${esc(FEEL_T[k])}</span>`).join("")}</div>`:""}

      <div><button type="button" class="btn slim ghost" data-act="delDive" data-v="${d.id}">${armed==="del"+d.id?"Tap again to delete":"Delete"}</button></div>

    <div class="stat"><span class="v">${lastR!=null?U.rmv(lastR):"–"}</span><span class="k">Last ${U.ru()}</span></div>
  </div></div>
  ${pts.length>=2? rmvSection(pts) : ""}
  <div class="section"><h3>Dives</h3><div class="panel">${list}</div></div>`;
}

let RC = {calm:false};
function rmvSection(allPts){
  const pts = RC.calm? allPts.filter(p=> p.d.cond && (p.d.cond.current==="none"||p.d.cond.current==="light")) : allPts;
  const n = pts.length;
  let lim = null, msg = "";
  if(n>=10){
    const v = pts.map(p=>p.r), mean = v.reduce((a,b)=>a+b,0)/n;
    const mr = v.slice(1).map((x,i)=>Math.abs(x-v[i])), mrbar = mr.reduce((a,b)=>a+b,0)/mr.length;
    lim = {mean, ucl: mean+2.66*mrbar, lcl: Math.max(0, mean-2.66*mrbar)};
    const last = v[n-1];
    let run = 0, side = 0;
    for(let i=n-1;i>=0;i--){ const sd = Math.sign(v[i]-mean); if(!sd) break; if(!side) side = sd; if(sd!==side) break; run++; }
    if(last > lim.ucl){ const c = pts[n-1].d.cond||{}; msg = `<span class="pill bad">Signal</span> Last dive is above your normal range. ${c.current==="strong"||c.current==="mod"? "Current was logged, which may explain it." : "Worth a look: conditions, stress, gear, or a leak?"}`; }
    else if(last < lim.lcl) msg = `<span class="pill good">Signal</span> Last dive is below your normal range. Note what was different.`;
    else if(run>=8 && side<0) msg = `<span class="pill good">Shift</span> ${run} dives in a row below your average. Your air use has genuinely improved.`;
    else if(run>=8 && side>0) msg = `<span class="pill warn">Shift</span> ${run} dives in a row above your average. Something has changed.`;
    else msg = `<span class="pill info">Stable</span> Differences between recent dives are normal variation. No single dive needs explaining.`;
  }
  return `<div class="section"><div class="spread"><h3>Air consumption (RMV)</h3>
      <div class="seg" style="flex:none;flex-wrap:nowrap;white-space:nowrap"><button type="button" class="${RC.calm?"":"on"}" data-act="rcCalm" data-v="0">All</button><button type="button" class="${RC.calm?"on":""}" data-act="rcCalm" data-v="1">Calm only</button></div></div>
    ${n>=2? `<div class="panel chart">${chart(pts, lim)}</div>` : `<div class="panel small muted">Need at least 2 calm dives with conditions logged.</div>`}
    ${lim? `<div class="legend"><span><i class="c"></i>Your average ${U.rmv(lim.mean)}</span><span><i></i>Normal range ${U.rmv(lim.lcl)} to ${U.rmv(lim.ucl)} ${U.ru()}</span></div><p class="small">${msg}</p>` : `<p class="small muted">Normal-range limits appear after 10 dives (${n} of 10). Lower is better. Uses liters, so any tank size compares fairly.</p>`}
  </div>`;
}
function chart(pts, lim){
  const W=320, H=150, pl=38, pr=12, pt=12, pb=26;
  const cv = x => imp()? x*0.0353147 : x;
  const vals = pts.map(p=> cv(p.r));
  let lo = Math.min(...vals, ...(lim?[cv(lim.lcl)]:[])), hi = Math.max(...vals, ...(lim?[cv(lim.ucl)]:[]));
  const pad = (hi-lo)*0.25 || (imp()?0.1:2); lo = Math.max(0, lo-pad); hi = hi+pad;
  const x = i => pl + (pts.length===1?0: i*(W-pl-pr)/(pts.length-1));
  const y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const ticks = [lo, (lo+hi)/2, hi];
  const fmt = v => imp()? v.toFixed(2) : v.toFixed(0);
  const line = vals.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = line + `L${x(vals.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  const li = vals.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Air consumption per dive">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmt(t)}</text>`).join("")}
    <path d="${area}" fill="var(--deep)" fill-opacity=".12"/>
    ${lim? `<line x1="${pl}" x2="${W-pr}" y1="${y(cv(lim.ucl))}" y2="${y(cv(lim.ucl))}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="${pl}" x2="${W-pr}" y1="${y(cv(lim.lcl))}" y2="${y(cv(lim.lcl))}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <line x1="${pl}" x2="${W-pr}" y1="${y(cv(lim.mean))}" y2="${y(cv(lim.mean))}" stroke="var(--muted)" stroke-width="1"/>` : ""}
    <path d="${line}" fill="none" stroke="var(--deep)" stroke-width="2"/>
    ${vals.map((v,i)=>{ const out = lim && (pts[i].r>lim.ucl || pts[i].r<lim.lcl); return `<circle cx="${x(i)}" cy="${y(v)}" r="${i===li||out?4.5:2.5}" fill="${out?"var(--bad)":i===li?"var(--accent)":"var(--deep)"}"/>`; }).join("")}
    <text x="${pl}" y="${H-8}" font-size="10" fill="var(--muted)">${esc(pts[0].d.date.slice(5))}</text>
    <text x="${W-pr}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(pts[li].d.date.slice(5))}</text>
  </svg>`;
}

/* --- Skills tab --- */
let SK = {cat:"All", log:null, hist:null, adding:false};
function skillStatus(id){
  const l = skillLog(id); if(!l.length) return `<span class="pill info">Not tried</span>`;
  const [tone,txt] = SKILL_RES[l[0].r]; return `<span class="pill ${tone}">${txt} \u00b7 ${l.length}\u00d7</span>`;
}
function suggestions(){
  const out = [], seen = new Set(S.skills.queue), add = (id, why)=>{ if(!seen.has(id) && skillBy(id) && out.length<3){ seen.add(id); out.push([id,why]); } };
  sorted().slice(0,3).forEach(d=> (d.feel||[]).forEach(f=> (SKILL_SUGGEST[f]||[]).forEach(id=> add(id, `You logged \u201c${FEEL_T[f]}\u201d recently`))));
  allSkills().forEach(x=>{ const l = skillLog(x[0]); if(l.length && l[0].r==="hard") add(x[0], `Struggled on ${l[0].date}. Try again`); });
  ["hover","frog","maskrr"].forEach(id=>{ if(!skillLog(id).length) add(id, "A core skill you haven't logged yet"); });
  return out;
}
function viewSkills(){
  const cats = ["All"].concat(SKILL_CATS, S.skills.custom.length? ["My skills"]:[]);
  const list = allSkills().filter(x=> SK.cat==="All" || x[1]===SK.cat);
  const q = S.skills.queue.map(skillBy).filter(Boolean);
  const sug = suggestions();
  const row = x=>{
    const id = x[0], queued = S.skills.queue.includes(id), hist = skillLog(id);
    return `<div class="skill">
      <div class="spread"><b>${esc(x[2])}</b>${skillStatus(id)}</div>
      ${x[3]?`<span class="how">${esc(x[3])}</span>`:""}${x[4]?`<span class="note">${esc(x[4])}</span>`:""}
      <div class="row">
        <button type="button" class="btn slim ${queued?"":"ghost"}" data-act="skillQueue" data-v="${id}">${queued?"On next dive \u2713":"Try next dive"}</button>
        <button type="button" class="btn slim ghost" data-act="skillLogOpen" data-v="${id}">Log practice</button>
        ${hist.length?`<button type="button" class="btn slim ghost" data-act="skillHist" data-v="${id}">${SK.hist===id?"Hide history":"History"}</button>`:""}
      </div>
      ${SK.log===id? `<div class="panel stack">
        <div class="seg">${Object.entries(SKILL_RES).map(([k,[,t]])=>`<button type="button" class="${SK.logRes===k?"on":""}" data-act="skillLogRes" data-v="${k}">${t}</button>`).join("")}</div>
        <div class="grid2"><input type="date" id="sk_date" value="${today()}"><input type="text" id="sk_note" placeholder="Note (optional)"></div>
        <div class="row"><button type="button" class="btn slim" data-act="skillLogSave" data-v="${id}">Save</button><button type="button" class="btn slim ghost" data-act="skillLogOpen" data-v="">Cancel</button></div>
      </div>`:""}
      ${SK.hist===id? `<div class="hist">${hist.map(h=>`<div><span class="mono small">${esc(h.date)}</span> <span class="pill ${SKILL_RES[h.r][0]}">${SKILL_RES[h.r][1]}</span>${h.site?` <span class="muted">${esc(h.site)}</span>`:""}${h.note?` \u00b7 ${esc(h.note)}`:""} <button type="button" class="star" data-act="skillDelLog" data-v="${h.id}">${armed==="sk"+h.id?"Tap to delete":"Delete"}</button></div>`).join("")}</div>`:""}
    </div>`;
  };
  return `<div class="section"><h1>Skills</h1>
    <p class="small muted">Optional. Pick something to work on, try it on a dive, and log how it went. Practice shallow, over sand, within your training, with your buddy briefed.</p></div>
  <div class="section"><h3>Next dive</h3><div class="panel">${q.length? `<div class="chips">${q.map(x=>`<button type="button" class="chip on" data-act="skillQueue" data-v="${x[0]}">${esc(x[2])} \u00d7</button>`).join("")}</div><p class="small muted" style="margin-top:8px">These show in Pre-dive, and you rate them in the Debrief.</p>` : `<p class="small muted">Nothing planned. Tap \u201cTry next dive\u201d on any skill.</p>`}</div></div>
  ${sug.length? `<div class="section"><h3>Suggested</h3><div class="panel">${sug.map(([id,why])=>{ const x = skillBy(id); return `<div class="skill"><div class="spread"><b>${esc(x[2])}</b><button type="button" class="btn slim" data-act="skillQueue" data-v="${id}">Try next dive</button></div><span class="small muted">${esc(why)}</span></div>`; }).join("")}</div></div>`:""}
  <div class="section"><div class="chips">${cats.map(c=>`<button type="button" class="chip ${SK.cat===c?"on":""}" data-act="skillCat" data-v="${c}">${c}</button>`).join("")}</div></div>
  <div class="section"><div class="panel">${list.map(row).join("")}</div></div>
  <div class="section"><h3>Add your own skill</h3><div class="panel stack">
    <input type="text" id="sk_newName" placeholder="Skill name, e.g. Hover while deploying a DSMB">
    <input type="text" id="sk_newHow" placeholder="How to do it (optional)">
    <button type="button" class="btn slim" data-act="skillAdd">Add skill</button>
  </div></div>`;
}

function stripTags(h){ return String(h).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim(); }
let GEAR_IX = null;
function gearIndex(){
  if(GEAR_IX) return GEAR_IX;
  GEAR_IX = [];
  GUIDES.forEach(g=> g.secs.forEach(sec=>{
    const text = stripTags(sec[3]);
    GEAR_IX.push({g:g.id, gname:g.name, id:sec[0], title:sec[1], blurb:sec[2], text, hay:(sec[1]+" "+sec[2]+" "+text+" "+(sec[4]||"")).toLowerCase()});
  }));
  return GEAR_IX;
}
function gearSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return [];
  return gearIndex().filter(r=> terms.every(t=> r.hay.includes(t))).slice(0,20).map(r=>{
    const low = r.text.toLowerCase(); let i = -1;
    for(const t of terms){ const j = low.indexOf(t); if(j>=0 && (i<0 || j<i)) i = j; }
    const snip = i<0? r.blurb : (i>50? "\u2026":"") + r.text.slice(Math.max(0,i-50), Math.max(0,i-50)+140) + "\u2026";
    return Object.assign({snip}, r);
  });
}
function gearResultsHtml(q){
  const res = gearSearch(q);

function convert(){

  } else if(CV.cat==="volume"){
    rows = CV.from==="l"
      ? [[`${r1(v)} L water capacity`, `${(v*207/28.3168).toFixed(1)} cu ft at 207 bar`], ["", `${(v*232/28.3168).toFixed(1)} cu ft at 232 bar`]]

  } else {
    const u = CONV[CV.cat].units, a = u.find(x=>x[0]===CV.from), b = u.find(x=>x[0]!==CV.from);

}

function calcNitrox(){
  const tested = num($("#nx_fo2").value), label = num($("#nx_label").value), depth = num($("#nx_depth").value), best = num($("#nx_depth").value);
  const unit = imp()?33:10, du = U.du();
  NX.fo2 = tested; NX.label = label; NX.depth = depth;
  const linked = S.draft && S.draft.gas==="nitrox";
  if(linked){ S.draft.fo2 = tested; S.draft.fo2Label = label; S.draft.planDepth = depth==null? null : U.dIn(depth); save(); }
  const fo2 = tested || label;
  $("#o_alert").innerHTML = gasCheck(tested, label, depth==null? null : U.dIn(depth), linked? S.draft.water : "salt");
  const set = (id,t)=>{ const e=$(id); if(e) e.textContent = t; };
  if(fo2 && fo2>=21 && fo2<=100){
    const f = fo2/100;
    set("#o_mod", `${Math.floor((NX.ppo2/f-1)*unit)} ${du}`);
    {
      const pp = NX.ppo2, lim = pp/f, mod = Math.floor((lim-1)*unit);
      const o = fo2>=36 ? Math.max(21,fo2-4) : fo2+4, olim = pp/(o/100), omod = Math.floor((olim-1)*unit);
      const name = x => x===21? "air" : `EAN${x}`;
      const [rich, lean] = o>fo2 ? [[o,olim,omod],[fo2,lim,mod]] : [[fo2,lim,mod],[o,olim,omod]];
      set("#o_modWhy", `Why more oxygen means a shallower MOD: ppO\u2082 = O\u2082 fraction \u00d7 ata, and pressure rises 1 ata every ${unit} ${du}. With more oxygen in every breath, you reach the ${pp} limit at less pressure. ${lean[0]===21?"Air":name(lean[0])} hits ${pp} at ${lean[1].toFixed(2)} ata (${lean[2]} ${du}); ${name(rich[0])} hits it at ${rich[1].toFixed(2)} ata (${rich[2]} ${du}). The trade-off: a richer mix gives longer no-deco time but a shallower depth limit.`);
    }
    if(depth!=null){
      const ata = depth/unit+1, pp = f*ata;
      set("#o_pp", pp.toFixed(2)); set("#o_ata", `${ata.toFixed(2)} ata`);
      set("#o_ead", `${Math.max(0,Math.ceil(((depth+unit)*(1-f)/0.79)-unit))} ${du}`);
      const note = $("#o_note");
      note.innerHTML = tested? "" : `<span class="pill warn">Using label value</span> Numbers above use the fill label until you enter a tested value.`;
    }
  } else { set("#o_modWhy",""); ["#o_mod","#o_pp","#o_ata","#o_ead"].forEach(i=>set(i,"–")); $("#o_note").textContent = "Enter an O₂ % between 21 and 100."; }
  if(best!=null && best>0){
    const ata = best/unit+1, raw = 1.4/ata, b = Math.floor(raw*100);
    set("#o_best", b<21? "Air" : `EAN${Math.min(b,40)}${b>40?"+":""}`);
    let why = `At ${best} ${du} you're breathing at ${ata.toFixed(2)} ata. Divide the 1.4 limit by that pressure: 1.4 \u00f7 ${ata.toFixed(2)} = ${raw.toFixed(3)}, or ${b}% O\u2082. That's the richest mix that keeps ppO\u2082 at or under 1.4 at your deepest point. More oxygen means less nitrogen and longer no-deco time. Round down, never up, so you stay under the limit.`;
    if(b>40) why += ` Recreational nitrox stops at EAN40, so use that.`;
    if(b<21) why = `At ${best} ${du} (${ata.toFixed(2)} ata), even air's 21% O\u2082 gives a ppO\u2082 of ${(0.21*ata).toFixed(2)}. No nitrox mix helps here, and this depth is past recreational limits.`;
    set("#o_bestWhy", why);
  }
  else { set("#o_best","\u2013"); set("#o_bestWhy",""); }
}

function efrStatus(c){
  if(!c.efr) return {ok:false, txt:"Not done yet. Needed before Rescue (within 24 months)."};
  const d = new Date(c.efr+"T00:00:00"); if(isNaN(d)) return {ok:false, txt:"Enter the course date."};
  const until = new Date(d); until.setMonth(until.getMonth()+24);
  const ok = until.getTime() > Date.now();
  return {ok, txt: ok? `Current until ${until.toISOString().slice(0,10)}.` : `Lapsed ${until.toISOString().slice(0,10)}. Renew before Rescue.`};
}

/* ---------- events ---------- */
function setField(d, f, raw, t){
  let val = raw;
  if(t){ const n = num(raw); val = n==null? null : t==="w"? U.wIn(n) : t==="d"? U.dIn(n) : t==="p"? U.pIn(n) : n; }
  if(f.startsWith("w.")) d.weights[f.slice(2)] = val||0; else d[f] = val;
}

document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.f && S.draft && el.id!=="coachKey"){
    setField(S.draft, el.dataset.f, el.value, el.dataset.t); save();
    if(S.draft.stage==="plan" && (el.tagName==="SELECT" || el.dataset.f.startsWith("w."))) updatePlanCoach();
    else if(S.draft.stage==="plan") updatePlanGas();
    if(S.draft.stage==="plan" && el.tagName==="SELECT"){ applyRecToDraft(S.draft); render(); }
    return;
  }
  if(el.id && el.id.startsWith("nx_")) calcNitrox();
  if(el.id==="c_temp" && S.draft){ const n = num(el.value); S.draft.cond.temp = n==null? null : imp()? r1((n-32)*5/9) : n; save(); }
  if(el.id==="c_surf" && S.draft){ S.draft.surfTime = el.value || null; save(); }
  if(el.dataset && el.dataset.skillnote && S.draft){ const id = el.dataset.skillnote; S.draft.skillRes = S.draft.skillRes||{}; S.draft.skillRes[id] = Object.assign(S.draft.skillRes[id]||{}, {note:el.value}); save(); }
  if(el.id==="cvVal"){ CV.val = el.value; convert(); return; }
  if(el.id==="gearQ"){
    GEARQ = el.value.trim();
    const box = $("#gearResults"), list = $("#gearList");
    if(box){ box.innerHTML = GEARQ? gearResultsHtml(GEARQ) : ""; box.hidden = !GEARQ; }
    if(list) list.hidden = !!GEARQ;
    return;
  }
  if(el.id==="termQ"){
    const q = el.value.toLowerCase().replace(/\u2082/g,"2").trim(); let n = 0;
    document.querySelectorAll("#termList .term").forEach(t=>{ const hit = !q || t.dataset.s.includes(q); t.hidden = !hit; if(hit) n++; });
    $("#termNone").hidden = n>0;
  }
  if(el.id==="p_h" || el.id==="p_w"){
    const h = num($("#p_h").value), w = num($("#p_w").value);

    const p=S.profile; $("#p_bmi").textContent = p.heightCm && p.weightKg ? (p.weightKg/Math.pow(p.heightCm/100,2)).toFixed(1) : "–";

});
document.addEventListener("change", e=>{

document.addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ tab = b.dataset.tab; armed=null; render(); window.scrollTo(0,0); return; }
  if(b.id==="unitBtn"){ S.units = imp()? "metric":"imperial"; save(); render(); return; }
  if(b.dataset.cv==="cvcat"){ CV.cat = b.dataset.v; CV.from = CONV[CV.cat].units[0][0]; render(); setTimeout(convert,0); return; }
  if(b.dataset.nx){ NX.ppo2 = parseFloat(b.dataset.v); b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); calcNitrox(); return; }
  if(b.dataset.me==="units"){ S.units = b.dataset.v; save(); render(); return; }
  if(b.dataset.f==="gas" && S.draft){
    S.draft.gas = b.dataset.v;
    if(b.dataset.v==="air"){ S.draft.fo2 = 21; S.draft.fo2Label = null; save(); render(); }
    else { if(S.draft.fo2===21) S.draft.fo2 = null; save(); tab = "nitrox"; render(); window.scrollTo(0,0); toast("Enter your mix"); }
    return;
  }
  if(b.dataset.f && S.draft){
    const f = b.dataset.f, v = b.dataset.v;
    S.draft[f] = f==="rating"? parseInt(v,10) : v; save();
    if(S.draft.stage==="plan" && f==="water") applyRecToDraft(S.draft);
    render(); return;
  }
  const act = b.dataset.act, v = b.dataset.v; if(!act) return;
  const d = S.draft;
  if(act!=="delDive" && act!=="reset" && act!=="discard" && act!=="skillDelLog" && act!=="tripReset" && act!=="delLearn" && act!=="certDelSpec") armed = null;
  switch(act){
    case "certAddSpec": { const t = ($("#cert_spec").value||"").trim(); if(t){ S.certs.specs.push(t); save(); render(); } break; }
    case "certDelSpec": if(armed==="cs"+v){ S.certs.specs.splice(+v,1); armed=null; save(); } else armed="cs"+v; render(); break;
    case "startDive": S.draft = newDraft(); save(); render(); window.scrollTo(0,0); break;
    case "startQuick": { const q = newDraft(); q.quick = true; q.stage = "pre"; S.draft = q; save(); render(); window.scrollTo(0,0); break; }
    case "toFull": d.quick = false; d.stage = "debrief"; save(); render(); window.scrollTo(0,0); toast("Full debrief: add the 5 m check and weights"); break;
    case "stage": d.stage = v; save(); render(); window.scrollTo(0,0); break;
    case "discard": if(armed==="discard"){ S.draft=null; armed=null; save(); } else armed="discard"; render(); break;
    case "feel": {
      const i = d.feel.indexOf(v);
      if(i>=0) d.feel.splice(i,1);
      else {
        d.feel.push(v); const g = FEEL_G[v];
        if(v==="good") d.feel = d.feel.filter(x=>FEEL_OK[x]);
        else if(FEEL_OK[v]) d.feel = d.feel.filter(x=> FEEL_OK[x] || FEEL_G[x]!==g);
        else d.feel = d.feel.filter(x=> x!=="good" && x!==GROUP_OK[g]);
      }
      save(); render(); break;
    }
    case "cond": { const [f,val] = v.split("|"); d.cond[f] = d.cond[f]===val? null : val; save(); render(); break; }
    case "deco": d.deco = v==="yes"; save(); render(); break;
    case "sos": backTab = tab==="emergency"? backTab : tab; tab = "emergency"; render(); window.scrollTo(0,0); break;
    case "ctSave": {
      const L = emList(); document.querySelectorAll("[data-ct]").forEach(el=>{ const [id,f] = el.dataset.ct.split("|"); const c = L.find(x=>x.id===id); if(c) c[f] = el.value.trim(); });
      EM.edit = false; save(); render(); toast("Contacts saved"); break;
    }
    case "meEdit": if(EM.meEdit){ document.querySelectorAll("[data-me]").forEach(el=>{ S.emergency.me[el.dataset.me] = el.value.trim(); }); save(); } EM.meEdit = !EM.meEdit; render(); break;
    case "meSave": { document.querySelectorAll("[data-me]").forEach(el=>{ S.emergency.me[el.dataset.me] = el.value.trim(); }); EM.meEdit = false; save(); render(); toast("Saved on this phone"); break; }
    case "ctEdit": EM.edit = !EM.edit; render(); break;
    case "ctAdd": emList().push({id:"k"+uid(), who:"New contact", num:"", sub:""}); EM.edit = true; save(); render(); break;
    case "ctDel": { const k = emRegion()==="ph"? "ph" : "contacts"; S.emergency[k] = emList().filter(c=>c.id!==v); save(); render(); break; }
    case "emRegion": S.emergency.region = v==="ph"? "ph" : "th"; EM.edit = false; save(); render(); break;
    case "backupNow": tab = "me"; render(); setTimeout(()=>{ const el = $("#backupPanel"); el && el.scrollIntoView({block:"start"}); }, 30); break;
    case "copyBackup": {
      try{ await navigator.clipboard.writeText(JSON.stringify(S)); markBackup(); toast("Backup copied. Paste it into Notes"); }
      catch(e){ toast("Couldn't copy. Use Export instead"); }
      break;
    }
    case "pasteRestore": {
      const t = ($("#pasteBox").value||"").trim();
      try{ const o = JSON.parse(t); if(!o || o.v!==1 || !Array.isArray(o.dives)) throw 0; S = migrate(o); save(); toast("Backup restored"); render(); }
      catch(e){ toast("That text isn't a Neutral backup"); }
      break;
    }
    case "tripReset": if(armed==="trip"){ S.trip = {name:S.trip.name, items:{}}; armed=null; save(); toast("Checklist cleared"); } else armed="trip"; render(); break;
    case "mkOpen": { const [gid,sid] = v.split("|"); MKS.guide = gid; MKS.sec = sid; GEARQ = ""; render(); window.scrollTo(0,0); break; }
    case "mkGuide": MKS.guide = v || null; MKS.sec = null; render(); window.scrollTo(0,0); break;
    case "mkSec": MKS.sec = v; render(); window.scrollTo(0,0); break;
    case "mkTop": MKS.sec = null; render(); window.scrollTo(0,0); break;
    case "rcCalm": RC.calm = v==="1"; render(); break;
    case "pickSite": d.site = v; save(); render(); break;
    case "skillRes": { const [id,r] = v.split("|"); d.skillRes = d.skillRes||{}; const cur = d.skillRes[id]||{}; d.skillRes[id] = Object.assign(cur, {r: cur.r===r? null : r}); save(); render(); break; }
    case "skillCat": SK.cat = v; render(); break;
    case "skillQueue": { const q = S.skills.queue, i = q.indexOf(v); if(i>=0) q.splice(i,1); else q.push(v); save(); render(); break; }
    case "skillLogOpen": SK.log = v || null; SK.logRes = null; render(); break;
    case "skillLogRes": SK.logRes = v; render(); break;
    case "skillLogSave": {
      if(!SK.logRes){ toast("Pick how it went"); break; }
      S.skills.log.push({id:uid(), skill:v, date:($("#sk_date").value||today()), r:SK.logRes, note:($("#sk_note").value||"").trim(), site:""});
      SK.log = null; SK.hist = v; save(); render(); toast("Practice logged"); break;
    }
    case "skillHist": SK.hist = SK.hist===v? null : v; render(); break;
    case "skillDelLog": if(armed==="sk"+v){ S.skills.log = S.skills.log.filter(l=>l.id!==v); armed=null; save(); } else armed = "sk"+v; render(); break;
    case "skillAdd": {
      const n = ($("#sk_newName").value||"").trim(); if(!n){ $("#sk_newName").focus(); break; }
      S.skills.custom.push({id:"c"+uid(), name:n, how:($("#sk_newHow").value||"").trim()}); SK.cat = "My skills"; save(); render(); toast("Skill added"); break;
    }
    case "applyRec": { const lr = latestRec(keyOf(d)); if(lr && lr.rec.change && !d.applied){ applyChange(d, lr.rec.change); save(); render(); toast("Change applied"); } break; }
    case "saveDive": {
      if(!d.check) d.check = "none";
      if(S.example){ S.dives = S.dives.filter(x=>!x.example); S.example=false; }
      const dive = Object.assign({}, d); delete dive.stage; delete dive.cues; delete dive.bwraf; delete dive.sorted; delete dive.xfer; delete dive.applied; delete dive.skillRes; delete dive.sigRot;
      if(d.gas!=="nitrox"){ dive.fo2 = 21; dive.fo2Label = null; }
      { const t = d.surfTime || nowHM(); const dt = new Date(`${d.date}T${t}:00`); dive.surfacedAt = isNaN(dt.getTime())? Date.now() : dt.getTime(); }
      dive.skillsTried = [];
      Object.entries(d.skillRes||{}).forEach(([id,res])=>{
        if(!res.r) return;
        if(res.r!=="skip"){ S.skills.log.push({id:uid(), skill:id, date:d.date, r:res.r, note:res.note||"", site:d.site||"", dive:d.id}); dive.skillsTried.push({skill:id, r:res.r}); }
        S.skills.queue = S.skills.queue.filter(x=> x!==id || res.r==="skip");
      });
      dive.key = keyOf(dive);
      const hist = divesFor(dive.key);
      if(d.quick){ dive.rec = null; S.dives.push(dive); S.draft = null; save(); render(); window.scrollTo(0,0); toast("Dive saved. No-fly clock running"); break; }
      dive.rec = recommend(dive, hist[hist.length-1]||null, S.dives.filter(x=>!x.quick));
      S.dives.push(dive); S.draft = null; coachKey = dive.key; tab = "coach"; save(); render(); window.scrollTo(0,0); toast("Dive saved"); break;
    }
    case "clearEx": S.dives = S.dives.filter(x=>!x.example); S.example = false; save(); render(); break;
    case "delDive": if(armed==="del"+v){ S.dives = S.dives.filter(x=>x.id!==v); armed=null; save(); } else armed="del"+v; render(); break;
    case "addCue": { const t = ($("#newCue").value||"").trim(); if(t){ S.cues.push(t); save(); render(); } break; }
    case "delCue": S.cues.splice(+v,1); save(); render(); break;
    case "lKind": learnKind = v; render(); break;
    case "addLearn": { const t=($("#lTitle").value||"").trim(), x=($("#lText").value||"").trim(), c=($("#lCue").value||"").trim(); if(t||x){ S.learnings.push({id:uid(), date:today(), kind:learnKind, title:t||x.slice(0,50), text:x, cue:c}); save(); toast("Learning saved"); render(); } break; }
    case "delLearn": if(armed==="L"+v){ S.learnings = S.learnings.filter(l=>l.id!==v); armed=null; save(); } else { armed="L"+v; } render(); break;
    case "reset": if(armed==="reset"){ const u=S.units, p=S.profile, c=S.cues, em=S.emergency, sf=S.sigFav, sl=S.sigLink, o0=S.learnings, ce=S.certs; S = blank(); S.units=u; S.profile=p; S.cues=c; S.emergency=em; S.sigFav=sf; S.sigLink=sl; S.learnings=(o0||[]); if(ce) S.certs=ce; armed=null; save(); toast("All dives erased"); } else armed="reset"; render(); break;
    case "export":
      if(!ai.downloads) return;
      try{ await ai.downloads.save({filename:`neutral-backup-${today()}.json`, data: JSON.stringify(S, null, 2)}); markBackup(); toast("Backup saved"); render(); }
      catch(err){ if(err && err.code!=="cancelled" && err.code!=="declined") toast("Export didn't complete"); }
      break;
    case "aiCoach": runAI("coach"); break;
    case "aiAsk": runAI("ask"); break;
    case "aiStop": aiCtl && aiCtl.abort(); break;
    case "sgCat": SG.cat = v; render(); break;
    case "sgStar": { const i = S.sigFav.indexOf(v); if(i>=0) S.sigFav.splice(i,1); else S.sigFav.push(v); save(); render(); break; }
    case "sgQuiz": {
      let ids = v==="star"? S.sigFav.filter(id=>SIG_BY[id]) : SIGNALS.map(x=>x[0]);
      if(!ids.length){ toast("Star some signals first"); break; }
      ids = ids.slice(); for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
      SG = Object.assign(SG, {mode:"quiz", deck:ids, i:0, show:false, miss:[]}); render(); window.scrollTo(0,0); break;
    }
    case "sgReveal": SG.show = true; render(); break;
    case "sgNext": {
      if(v==="miss") SG.miss.push(SG.deck[SG.i]);
      if(SG.i < SG.deck.length-1){ SG.i++; SG.show=false; }
      else if(SG.miss.length){ toast(`${SG.miss.length} to review again`); SG.deck = SG.miss; SG.miss=[]; SG.i=0; SG.show=false; }
      else { toast("All signals known"); SG.mode="list"; }
      render(); break;
    }
    case "sgExit": SG.mode="list"; render(); break;
    case "sgLink": {
      const t = ($("#sigLink").value||"").trim();
      if(t && !/^https?:\/\//i.test(t)){ toast("Links need to start with https://"); break; }
      S.sigLink = t; save(); toast(t? "Link saved":"Link removed"); render(); break;
    }
  }
});

S = load();
if(S) migrate(S);
if(!S){ S = blank(); seedExamples(); save(); }
render();
})();
</script>
